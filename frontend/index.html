<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A2F6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monitor">
  <title>Boord Monitor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-name">Monitor</span>
      <span id="role" class="chip"></span>
    </div>
    <div class="top-actions">
      <button id="history-btn" class="icon-btn" type="button" aria-label="Recent changes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button id="alerts-btn" class="icon-btn" type="button" aria-label="Alerts on this phone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span id="alerts-dot" class="badge" hidden></span>
      </button>
      <button id="check-now" class="icon-btn" type="button" aria-label="Check now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="banner" class="banner banner-unknown" aria-live="polite">
      <div class="banner-row">
        <span class="banner-title" id="banner-title">Checking…</span>
        <span class="banner-time" id="checked-at"></span>
      </div>
      <div id="banner-problems" class="banner-problems"></div>
    </section>

    <div id="offline" class="notice" hidden>
      Can't reach the monitor - showing <span id="offline-since"></span>.
    </div>

    <div id="groups" class="groups"></div>

    <footer class="foot muted"><span id="version"></span> · tap any dot for detail</footer>
  </main>

  <!-- One sheet for everything that used to be its own card: a check's full
       story, the history, the alert settings. Built in app.js each time. -->
  <dialog id="sheet">
    <div id="sheet-body"></div>
    <div class="row-actions">
      <button class="btn btn-quiet" type="button" id="sheet-close">Close</button>
    </div>
  </dialog>

  <dialog id="pin-dialog">
    <form method="dialog" id="pin-form">
      <h2>Admin PIN</h2>
      <p class="muted">Needed to restart an app or turn on alerts.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required minlength="4">
      <p id="pin-error" class="error" hidden></p>
      <div class="row-actions">
        <button class="btn" type="submit" value="ok">Sign in</button>
        <button class="btn btn-quiet" type="button" id="pin-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="restart-dialog">
    <h2 id="restart-title">Restart</h2>
    <p id="restart-warning" class="muted"></p>
    <pre id="restart-output" class="log" hidden></pre>
    <div class="row-actions">
      <button class="btn btn-danger" type="button" id="restart-go">Restart</button>
      <button class="btn btn-quiet" type="button" id="restart-close">Cancel</button>
    </div>
  </dialog>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
